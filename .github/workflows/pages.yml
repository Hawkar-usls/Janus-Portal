name: Publish static Portal to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: janus-portal-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run verify
      - name: Assemble public files only
        run: |
          mkdir -p dist/src
          cp index.html favicon.svg federation.html federation-catalog.json dist/
          cp src/*.js src/styles.css src/federation.css dist/src/
          sed -i "s|./src/federation.js|./src/federation.js?build=${GITHUB_SHA}|g; s|./src/federation.css|./src/federation.css?build=${GITHUB_SHA}|g" dist/federation.html
          test -s dist/federation-catalog.json
          test -s dist/src/gaze.js
          test -s dist/src/attention.js
          # GitHub Pages caches both JS and CSS for 600 seconds. HTML can be
          # newer than these assets: a stale R10 JS with R11 HTML leaves the
          # selector stuck forever on "Проверяем...". Version BOTH file URLs
          # atomically from the same deployment SHA; source remains R2 paths.
          sed -i "s|./src/app.js|./src/app.js?build=${GITHUB_SHA}|g; s|./src/styles.css|./src/styles.css?build=${GITHUB_SHA}|g" dist/index.html
          grep -Fq "./src/app.js?build=${GITHUB_SHA}" dist/index.html
          grep -Fq "./src/styles.css?build=${GITHUB_SHA}" dist/index.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      # Artifact metadata is occasionally not visible immediately after a 200 OK
      # upload. Give GitHub's Actions artifact index time to become consistent.
      - name: Wait for Pages artifact indexing
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
