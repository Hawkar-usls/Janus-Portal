name: Publish static Portal to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'favicon.svg'
      - 'src/**'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: janus-portal-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run verify
      - name: Assemble public files only
        run: |
          mkdir -p dist/src
          cp index.html favicon.svg dist/
          cp src/*.js src/styles.css dist/src/
          test -s dist/src/gaze.js
          test -s dist/src/attention.js
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      # Artifact metadata is occasionally not visible immediately after a 200 OK
      # upload. Give GitHub's Actions artifact index time to become consistent.
      - name: Wait for Pages artifact indexing
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
