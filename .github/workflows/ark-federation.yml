name: ARK federation catalogue checks
on:
  pull_request:
    paths:
      - 'federation.html'
      - 'federation-catalog.json'
      - 'src/federation.*'
      - 'tests/federation.test.mjs'
      - 'index.html'
      - '.github/workflows/pages.yml'
      - '.github/workflows/ark-federation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node --version && node --check src/federation.js && npm run verify
